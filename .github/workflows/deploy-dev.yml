- name: Configure SSH
  if: github.event_name == 'push' && github.ref == 'refs/heads/develop'
  env:
    SSH_PRIVATE_KEY_B64: ${{ secrets.DEV_SERVER_SSH_KEY_B64 }}
    SSH_KNOWN_HOSTS: ${{ secrets.DEV_SERVER_KNOWN_HOSTS }}
  run: |
    mkdir -p ~/.ssh
    chmod 700 ~/.ssh

    printf '%s' "$SSH_PRIVATE_KEY_B64" | base64 --decode > ~/.ssh/id_ed25519
    chmod 600 ~/.ssh/id_ed25519

    printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
    chmod 600 ~/.ssh/known_hosts

    ssh-keygen -y -f ~/.ssh/id_ed25519 > /dev/null
