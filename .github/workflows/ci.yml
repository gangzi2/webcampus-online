name: WebCampus CI - Build & Test

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Cloner le dépôt
        uses: actions/checkout@v4

      # -----------------------------------------
      # 1. COMPILATION FRONTEND ANGULAR (Nx)
      # -----------------------------------------
      - name: 🟢 Installer Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: 📦 Installer les dépendances Node
        run: npm install

      - name: ⚡ Compiler l'application Angular (Nx)
        run: npx nx build Webcampus-app

      # -----------------------------------------
      # 2. COMPILATION BACKEND .NET 10
      # -----------------------------------------
      - name: 🔷 Installer le SDK .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: ⚙️ Restaurer les packages .NET
        run: dotnet restore apps/backend_api/backend_api.csproj

      - name: 🔨 Compiler le Backend .NET
        run: dotnet build apps/backend_api/backend_api.csproj --configuration Release --no-restore
