 
<article [class]="bgColor()"
    class="hlmCard group relative overflow-hidden rounded-2xl border border-slate-200/80 shadow-xl shadow-slate-900/5 transition-all duration-500 hover:-translate-y-2 hover:border-primary/40 hover:shadow-2xl hover:shadow-primary/5 p-0 h-full flex flex-col justify-between">

    <!-- 1. Barre d'accentuation latérale -->
    <div
        class="absolute left-0 top-0 h-full w-1 bg-primary opacity-0 transition-opacity duration-300 group-hover:opacity-100 z-20">
    </div>

    <div>
        <!-- 2. Zone Image "Pro" fusionnée -->
        @if (imageUrl()) {
        <div class="relative h-44 w-full overflow-hidden border-b border-slate-100/50">
            <img [src]="imageUrl()" [alt]="title()"
                class="absolute inset-0 h-full w-full object-cover opacity-90 transition-transform duration-700 ease-in-out group-hover:scale-105" />
            <!-- Dégradé progressif transparent -->
            <div class="absolute inset-0 bg-gradient-to-b from-transparent via-black/10 to-black/30"></div>

            <!-- Badge optionnel -->
            @if (badgeText()) {
            <div class="absolute top-3 right-3 z-10">
                <span
                    class="inline-flex items-center rounded-md bg-white/90 border border-slate-200 px-2.5 py-1 text-[11px] font-medium text-slate-700 shadow-sm backdrop-blur-md">
                    {{ badgeText() }}
                </span>
            </div>
            }
        </div>
        }

        <!-- 3. Contenu de la carte avec décalage (-mt-10) si image présente -->
        <div class="relative z-10 px-6 pb-6 flex-1 flex flex-col">

            <!-- En-tête : Icône avec glow léger en chevauchement -->
            @if (iconName()) {
            <div class="relative mb-5 h-14 w-14" [class.-mt-10]="imageUrl()">
                <!-- Effet Glow derrière l'icône -->
                <div
                    class="absolute -inset-2 rounded-full bg-primary/10 opacity-0 blur-xl transition-opacity duration-500 group-hover:opacity-100">
                </div>
                <!-- Conteneur de l'icône -->
                <div
                    class="relative flex h-14 w-14 items-center justify-center rounded-2xl border border-slate-200 bg-white shadow-md transition-transform duration-300 group-hover:scale-110 group-hover:border-primary/50">
                    <ng-icon [name]="iconName()" class="text-2xl text-primary" />
                </div>
            </div>
            }

            <!-- Titre -->
            <h3 hlmCardTitle
                class="text-xl font-bold tracking-tight text-slate-900 transition-colors duration-300 group-hover:text-primary">
                {{ title() }}
            </h3>

            <!-- Description -->
            <div hlmCardContent class="p-0 mt-3">
                <p hlmCardDescription class="leading-relaxed text-sm text-slate-600">
                    {{ description() }}
                </p>
            </div>

        </div>
    </div>

    <!-- Footer optionnel avec lien -->
    @if (linkText()) {
    <div
        class="px-6 py-4 border-t border-slate-100 bg-black/5 flex items-center justify-between text-xs text-slate-500 mt-auto">
        <span class="font-medium text-slate-600">Service Pro</span>
        <span
            class="font-semibold text-primary inline-flex items-center gap-1 transition-transform group-hover:translate-x-1">
            {{ linkText() }} →
        </span>
    </div>
    }

</article>
